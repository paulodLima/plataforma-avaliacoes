services:
  postgres:
    image: postgres:16
    container_name: plataforma-avaliacoes-postgres
    environment:
      POSTGRES_DB: plataforma_avaliacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
